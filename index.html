<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Press Me</title>
<meta name="description" content="One button. Frayed nerves. A reflex game where you only press when you're told to.">
<meta property="og:title" content="Don't Press Me">
<meta property="og:description" content="One button. Frayed nerves. Free on the App Store.">
<meta name="apple-itunes-app" content="app-id=6812748969">
<style>
  :root { --hazard: #f2c200; --ink: #1a1714; --ink-soft: #4a4238; --paper: #fffdf6; --line: #e6dcc0; --red: #e0301e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f3ecd9; --ink-soft: #c9bfa8; --paper: #17140f; --line: #3a3326; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .band { height: 14px; background: repeating-linear-gradient(-45deg, #1a1714 0 12px, var(--hazard) 12px 24px); }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; text-align: center; }
  .btn { width: 148px; height: 148px; margin: 8px auto 24px; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #ff7560, var(--red) 45%, #9c1e10); box-shadow: 0 0 0 20px #231f1b, 0 18px 40px rgba(0,0,0,.35); }
  h1 { font-size: 2.4rem; line-height: 1.1; margin: 0 0 .3em; }
  p.tag { font-size: 1.2rem; color: var(--ink-soft); margin: 0 0 1.6em; }
  .badge img { height: 54px; }
  .local { margin-top: 2.4em; padding-top: 1.2em; border-top: 1px solid var(--line); }
  .local h2 { font-size: 1.6rem; margin: 0 0 .2em; }
  footer { color: var(--ink-soft); font-size: .9rem; margin-top: 3em; }
  a { color: inherit; text-decoration-color: var(--red); text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="band"></div>
<main>
  <div class="btn" aria-hidden="true"></div>
  <h1>Don't Press Me</h1>
  <p class="tag">One button. Frayed nerves. Press only when you're told to.</p>
  <a class="badge" href="https://apps.apple.com/app/id6812748969"><img src="https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/en-us" alt="Download on the App Store"></a>

  <!-- Each visitor sees only their own browser language's section (plus English). -->
  <div class="local" dir="rtl" lang="ar" hidden>
    <h2>لا تضغط عليّ</h2>
    <p class="tag">زرّ واحد. أعصاب مشدودة. اضغط فقط عندما يُطلب منك.</p>
    <a class="badge" href="https://apps.apple.com/app/id6812748969"><img src="https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/ar-sa" alt="حمّل من App Store"></a>
  </div>
  <div class="local" dir="rtl" lang="he" hidden>
    <h2>אל תלחץ עליי</h2>
    <p class="tag">כפתור אחד. עצבים מתוחים. לחץ רק כשאומרים לך.</p>
    <a class="badge" href="https://apps.apple.com/app/id6812748969"><img src="https://tools.applemarketingtools.com/api/badges/download-on-the-app-store/black/he-il" alt="להורדה ב-App Store"></a>
  </div>
  <script>
    (function () {
      var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(function (l) { return String(l).toLowerCase(); });
      document.querySelectorAll('.local').forEach(function (el) {
        var code = el.getAttribute('lang');
        var match = langs.some(function (l) { return l.indexOf(code) === 0 || (code === 'he' && l.indexOf('iw') === 0); });
        if (match) el.hidden = false;
      });
    })();
  </script>

  <footer>
    <a href="/dontpressme-site/support/">Support</a> · <a href="/dontpressme-site/privacy/">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
